# Weekly PRs that keep every pinned version current: GitHub Actions (commit
# SHAs), dev tooling (requirements-dev.txt) and the CI base image (Dockerfile
# tag + digest). Each PR runs through CI before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
